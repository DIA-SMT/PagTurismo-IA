# /etc/nginx/sites-available/portalturismo — primer paso, solo HTTP. Después:
#   certbot --nginx -d portalturismo.195-35-42-168.sslip.io
# y en el bloque 443 que crea certbot se agrega lo de abajo (ver deploy/README.md).
server {
  listen 80;
  listen [::]:80;
  server_name portalturismo.195-35-42-168.sslip.io;
  access_log /var/log/nginx/portalturismo.access.log;
  error_log /var/log/nginx/portalturismo.error.log;
  location / {
    proxy_pass http://127.0.0.1:3007;
  }
}

