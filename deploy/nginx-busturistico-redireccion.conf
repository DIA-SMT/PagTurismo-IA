# /etc/nginx/sites-available/turismo (busturistico.smt.gob.ar) — DESPUÉS del corte.
# El sitio Next del bus deja de atender: todo va al portal con redirecciones permanentes, para no
# romper los enlaces de los correos (/reserva/<token>), los QR impresos (/fotos/<token>) ni los
# buscadores. El bot de Migue (location /turismo/ en srv1915283.hstgr.cloud) NO se toca.
# Ver docs/PLAN_MIGRACION.md §4. Probar con `nginx -t` antes de `systemctl reload nginx`.

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name busturistico.smt.gob.ar;
  # (los ssl_certificate que ya tiene el bloque actual)

  # Las APIs públicas viejas durante 30 días: 307 conserva el método (POST de reservas).
  location /api/ {
    return 307 https://turismo.smt.gob.ar$request_uri;
  }
  location = / { return 308 https://turismo.smt.gob.ar/bus-turistico; }
  location = /turistico { return 308 https://turismo.smt.gob.ar/bus-turistico; }
  location = /educativo { return 308 https://turismo.smt.gob.ar/bus-educativo; }
  location ~ ^/fotos/([0-9a-f]{48})$ { return 308 https://turismo.smt.gob.ar/galeria/$1; }
  location / {
    # /reserva/<token>, /galeria, /bicitour/<codigo>, /admin… existen con el mismo camino en el portal.
    return 308 https://turismo.smt.gob.ar$request_uri;
  }
}
